<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone mock-ups</title>
<style>
  body { margin: 0; min-height: 100vh; background: #dfe3ea; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; color: #1f2430; }
  .page-head { text-align: center; padding: 28px 16px 0; }
  .page-head h1 { margin: 0; font-size: 28px; }
  .page-head p { margin: 6px 0 0; color: #5b6270; font-size: 15px; }
  #stage { display: flex; gap: 48px; padding: 24px; transform-origin: top center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .col h2 { margin: 0; font-size: 20px; }
  .col .spec { margin: 0 0 4px; font-size: 13px; color: #5b6270; }
  .phone { position: relative; background: #0b0b0d; box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 0 0 2px #3a3a3f; }
  .phone iframe { display: block; border: 0; background: #fff; }
  .iphone { padding: 12px; border-radius: 62px; }
  .iphone iframe { width: 390px; height: 800px; margin-top: 44px; border-radius: 0 0 50px 50px; }
  .status { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; z-index: 1; }
  .iphone .status { top: 12px; height: 44px; padding: 0 34px; background: #f4f5f7; color: #111; margin: 0 12px; padding: 0 26px; border-radius: 50px 50px 0 0; }
  .galaxy .status { top: 9px; height: 30px; margin: 0 9px; padding: 0 22px; background: #14161b; color: #eee; border-radius: 32px 32px 0 0; font-size: 12px; }
  .iphone .island { position: absolute; top: 24px; left: 50%; width: 120px; height: 34px;
                    margin-left: -60px; background: #000; border-radius: 20px; z-index: 2; }
  .iphone .bar { position: absolute; bottom: 20px; left: 50%; width: 140px; height: 5px;
                 margin-left: -70px; background: rgba(120,120,120,.8); border-radius: 3px; z-index: 2; }
  .galaxy { padding: 9px; border-radius: 40px; }
  .galaxy iframe { width: 360px; height: 770px; margin-top: 30px; border-radius: 0 0 32px 32px; }
  .galaxy .punch { position: absolute; top: 22px; left: 50%; width: 14px; height: 14px;
                   margin-left: -7px; background: #000; border-radius: 50%; z-index: 2;
                   box-shadow: 0 0 0 2px #1a1a1d; }
  .galaxy .bar { position: absolute; bottom: 16px; left: 50%; width: 110px; height: 4px;
                 margin-left: -55px; background: rgba(120,120,120,.8); border-radius: 3px; z-index: 2; }
</style>
</head>
<body>
<header class="page-head">
  <h1>To-Do App Mock-ups</h1>
  <p>The app as it looks on an iPhone and a Samsung Galaxy phone</p>
</header>
<div id="stage">
  <div class="col">
    <h2>iPhone 15</h2>
    <p class="spec">390 × 844 · light mode</p>
    <div class="phone iphone"><div class="status"><span>9:41</span><span>📶 🔋</span></div><div class="island"></div><div class="bar"></div><iframe id="f1" title="iPhone"></iframe></div>
  </div>
  <div class="col">
    <h2>Samsung Galaxy S</h2>
    <p class="spec">360 × 800 · dark mode</p>
    <div class="phone galaxy"><div class="status"><span>9:41</span><span>📶 🔋</span></div><div class="punch"></div><div class="bar"></div><iframe id="f2" title="Galaxy"></iframe></div>
  </div>
</div>
<script>
  // Seed sample tasks, then load the real app (../index.html) in both frames.
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const t = (text, due, category, done) => ({ id: text.replace(/\W/g,''), text, due, category, done: !!done, createdAt: 1 });
  // Demo mode: the app reads these from its own separate key, so real tasks are never touched.
  localStorage.setItem('todo.demo.tasks', JSON.stringify([
    t('Submit quarterly report', day(-1), 'work'),
    t('Team standup prep', day(0), 'work'),
    t('Book dentist appointment', day(2), 'personal'),
    t('Plan weekend trip', day(9), 'personal'),
    t('Renew passport', '', 'others'),
    t('Buy groceries', day(-2), 'personal', true)
  ]));
  document.getElementById('f1').src = '../index.html?demo=light';
  document.getElementById('f2').src = '../index.html?demo=dark';
  // Scale the whole stage to fit the window.
  function fit() {
    const s = Math.min(1, innerWidth / 900, (innerHeight - 90) / 960);
    const st = document.getElementById('stage');
    st.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
